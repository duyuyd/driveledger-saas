name: Android Debug APK — DriveLedger NPT duy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check web, mobile and domain invariants"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ "$SUPABASE_URL" != https://*.supabase.co || -z "$SUPABASE_KEY" ]]; then
            echo '::error::Configure GitHub Repository Variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1;
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate mobile types
        run: npm run typecheck:mobile
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build signed debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DriveLedger-0.2.0-NPT-Duy-Android-Debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
