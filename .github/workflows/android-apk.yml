name: Android Standalone Preview APK — DriveLedger NPT duy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check web, mobile and domain invariants"]
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Load public backend settings
        run: |
          for attempt in {1..20}; do
            if node scripts/mobile-build-env.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate mobile types
        run: npm run typecheck:mobile
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release-variant APK (debug key, preview only)
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Validate embedded JS and APK structure
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -p "$apk" assets/index.android.bundle > "$RUNNER_TEMP/driveledger.bundle"
          test -s "$RUNNER_TEMP/driveledger.bundle"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/DriveLedger-NPT-duy-Android.apk"
      - name: Publish validated APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriveLedger-NPT-duy-Android
          path: DriveLedger-NPT-duy-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch APK on Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/check-android-launch.sh
      - name: Publish downloadable APK for this main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag="android-${sha:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$sha" --title "DriveLedger · NPT duy · Android (${sha:0:8})" --notes "APK thử nghiệm dùng độc lập, ký bằng khóa phát triển. Nhà phát triển NPT duy." --prerelease
          fi
          gh release upload "$tag" DriveLedger-NPT-duy-Android.apk --clobber
