name: Pin npm dependency tree
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile.yml'
      - 'package.json'
      - 'apps/web/package.json'
      - 'apps/mobile/package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'duyuyd/driveledger-saas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate lockfile from exact package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          git config user.name 'NPT duy CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): lock workspace dependencies'
            git push origin HEAD:main
          fi
