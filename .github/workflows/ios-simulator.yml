name: iOS Simulator Build — DriveLedger NPT duy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check required Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Generate iOS project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: npx expo prebuild --platform ios --non-interactive --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          if [[ -z "$workspace" ]]; then echo 'No Xcode workspace created' >&2; exit 1; fi
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/ios-build" CODE_SIGNING_ALLOWED=NO build
          app=$(find ios-build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app" ]]; then echo 'No simulator .app found' >&2; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$GITHUB_WORKSPACE/DriveLedger-iOS-Simulator.zip"
      - name: Upload simulator-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriveLedger-NPT-Duy-iOS-Simulator-Unsigned
          path: DriveLedger-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

# IMPORTANT: Unsigned .app is for iOS Simulator on macOS only.
# Installing onto physical iPhone requires provisioning/signing by the user's Apple account.
# This job does not produce a distributable .ipa and never claims that it does.
