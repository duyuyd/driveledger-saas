name: Check web, mobile and domain invariants
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test domain invariants
        run: npm test
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Typecheck mobile
        run: npm run typecheck:mobile
      - name: Build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-not-a-real-key
        run: npm run build --workspace @driveledger/web
